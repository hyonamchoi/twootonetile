<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9a98f"/><stop offset="1" stop-color="#93846d"/></linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eaf3f7"/><stop offset="1" stop-color="#d5e5ee"/></linearGradient>
  </defs>
  <polygon points="0,0 1200,0 960,140 240,140" fill="#f3f0ea"/>
  <polygon points="0,0 240,140 240,640 0,900" fill="#dcd5c8"/>
  <polygon points="1200,0 960,140 960,640 1200,900" fill="#d2cabc"/>
  <rect x="240" y="140" width="720" height="500" fill="#e4ded2"/>
  <polygon points="0,900 240,640 960,640 1200,900" fill="url(#fl)"/>
  <!-- upper cabinets -->
  <rect x="240" y="170" width="190" height="170" fill="#d9cdb6" stroke="#b8ab92" stroke-width="2"/>
  <rect x="770" y="170" width="190" height="170" fill="#d9cdb6" stroke="#b8ab92" stroke-width="2"/>
  <rect x="338" y="172" width="2" height="166" fill="#b8ab92"/><rect x="866" y="172" width="2" height="166" fill="#b8ab92"/>
  <!-- window -->
  <rect x="460" y="190" width="280" height="150" fill="#f6f4ef"/><rect x="472" y="202" width="256" height="126" fill="url(#win)"/>
  <!-- hood -->
  <polygon points="520,160 680,160 700,205 500,205" fill="#bdbab3"/>
  <!-- backsplash band (wall) -->
  <rect x="240" y="340" width="720" height="130" fill="#e4ded2"/>
  <!-- counter -->
  <rect x="240" y="470" width="720" height="26" fill="#f1eee8"/>
  <!-- lower cabinets -->
  <rect x="240" y="496" width="720" height="144" fill="#cdbfa5" stroke="#b3a58a" stroke-width="2"/>
  <g stroke="#b3a58a" stroke-width="2"><line x1="400" y1="496" x2="400" y2="640"/><line x1="560" y1="496" x2="560" y2="640"/><line x1="720" y1="496" x2="720" y2="640"/><line x1="860" y1="496" x2="860" y2="640"/></g>
  <!-- cooktop & sink -->
  <rect x="560" y="462" width="160" height="10" fill="#4a4a4d"/>
  <ellipse cx="320" cy="482" rx="62" ry="8" fill="#c9cdd0"/>
  <rect x="314" y="440" width="12" height="38" fill="#b9b6ae"/>
  <!-- island -->
  <polygon points="300,760 900,760 960,820 240,820" fill="#e9e4da"/>
  <rect x="300" y="760" width="600" height="0" fill="none"/>
  <text x="600" y="880" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#00000055">데모 일러스트 · 실제 주방 사진을 올려 보세요</text>
</svg>
